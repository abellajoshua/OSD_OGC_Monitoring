<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSD & OGC Monitoring | Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <main class="auth">
      <div class="auth-card">
        <div class="auth-brand">
          <img src="assets/logo.png" alt="Batangas State University logo" />
          <div>
            <p class="auth-title">OSD & OGC Monitoring</p>
            <p class="auth-subtitle">Secure staff access portal</p>
          </div>
        </div>

        <h1>Sign in</h1>
        <p class="auth-lead">Enter your credentials to access the monitoring system.</p>

        <form class="auth-form" id="login-form">
          <label>
            Email
            <input type="email" name="email" placeholder="name@batsu.edu.ph" required />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="••••••••" required />
          </label>
          <button class="primary" type="submit">Login</button>
        </form>

        <p class="form-status" id="login-status" aria-live="polite"></p>

        <div class="auth-links">
          <a href="register.html">Create an account</a>
          <a href="index.html">Back to home</a>
        </div>
      </div>
    </main>

    <script src="runtime-config.js"></script>
    <script type="module" src="login.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
