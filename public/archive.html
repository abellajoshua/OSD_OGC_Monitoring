<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSD & OGC Monitoring | Archive</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <img src="assets/logo.png" alt="Batangas State University logo" />
        </div>
        <div>
          <p class="brand-title">Archive Center</p>
          <p class="brand-subtitle">Download CSV logs for record-keeping</p>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-btn" href="index.html">Back to Dashboard</a>
      </nav>
    </header>

    <main class="container-fluid container-xl">
      <section class="sheet">
        <div class="log-title">
          <h2>Archive Downloads</h2>
          <h3>CSV Exports</h3>
        </div>
        <div class="archive-links">
          <button class="primary" id="archive-minor" type="button">Minor Offenses CSV</button>
          <button class="ghost" id="archive-uniform" type="button">Non-Wearing Uniform CSV</button>
          <button class="ghost" id="archive-gatepass" type="button">Gatepass CSV</button>
          <button class="ghost" id="archive-goodmoral" type="button">Good Moral CSV</button>
        </div>
        <p class="archive-note">Use the browser print dialog in the Minor Offense tab to save PDFs.</p>
        <p class="form-status" id="archive-status" aria-live="polite"></p>
      </section>
    </main>

    <script src="runtime-config.js"></script>
    <script type="module" src="auth-guard.js"></script>
    <script type="module" src="archive.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
